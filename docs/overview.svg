<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Duo overview</title>
  <desc id="desc">A dark macOS-style dashboard with Codex account cards and a Claude Code token usage section.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151719"/><stop offset="1" stop-color="#222427"/></linearGradient>
    <linearGradient id="plus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0edff"/><stop offset="1" stop-color="#d9e7ff"/></linearGradient>
    <linearGradient id="pro" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25231f"/><stop offset="1" stop-color="#111214"/></linearGradient>
    <linearGradient id="cc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2c8ad"/><stop offset="1" stop-color="#c06b4c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
